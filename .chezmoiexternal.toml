# Upstream repos, cloned not vendored. chezmoi runs `git pull` in each on apply,
# so these track their remotes rather than pinning.

[".config/nvim"]
    type = "git-repo"
    url = "https://github.com/diejor/nvim-config.git"
    [".config/nvim".clone]
        args = ["--depth", "1"]

[".tmux/plugins/tpm"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tpm.git"
    [".tmux/plugins/tpm".clone]
        args = ["--depth", "1"]
