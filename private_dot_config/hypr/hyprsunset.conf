# Night light. Two-stage ramp: a moderate filter from late afternoon, deepening
# to full strength at night. 17:40 matches the old wlsunset window; 1000 K is
# the hard floor of hyprsunset's 1000-20000 K range.
#
# Started from hyprland.lua, not systemd. Both service files this replaced were
# wired to targets that are never reached under bare Hyprland (no uwsm), so
# neither ever ran -- see the hyprland.start block.

max-gamma = 100

profile {
    time = 17:40
    temperature = 4000
}

profile {
    time = 22:00
    temperature = 1000
}

profile {
    time = 6:00
    identity = true
}
